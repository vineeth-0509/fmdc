<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F6F2;color:#17201B;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  main{max-width:320px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#55615A;line-height:1.5;margin:0 0 20px}
  button{min-height:48px;padding:0 24px;border:0;border-radius:12px;background:#1E4D3A;color:#fff;font-size:15px;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>No connection</h1>
  <p>Orders need the internet so that prices and stock are correct. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
